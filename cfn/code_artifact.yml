AWSTemplateFormatVersion: 2010-09-09
Description: "Template for CodeArtifact repositories. Creates Domain if CreateDomainFlag is True"
Parameters:
  DomainName:
    Type: String
    Description: The name of the CodeArtifact Domain
    Default: crypto-tools-internal
  RepositoryName:
    Type: String
    Description: Base Name for the Repositories
    Default: esdk-java
  CreateDomainFlag:
    Type: String
    Description: Attempt to create Domain or not
    Default: False
    AllowedValues:
      - True
      - False

Conditions:
  CreateDomain: !Equals
    - !Ref CreateDomainFlag
    - True

Resources:
  Domain:
    Type: AWS::CodeArtifact::Domain
    Condition: CreateDomain
    Properties:
      DomainName: !Ref DomainName
      Tags:
        - Key: yor_trace
          Value: 50aaca28-753d-46cc-ae3b-c25ac04f5f85
        - Key: manny
          Value: cepeda
        - Key: git_org
          Value: itariq20
  CIRepo:
    Type: AWS::CodeArtifact::Repository
    Properties:
      DomainName: !Ref DomainName
      RepositoryName: !Sub "${RepositoryName}-ci"
      Tags:
        - Key: yor_trace
          Value: ed03d757-847c-4642-bbb7-579b9b0785c1
        - Key: manny
          Value: cepeda
        - Key: git_org
          Value: itariq20
  StagingRepo:
    Type: AWS::CodeArtifact::Repository
    Properties:
      DomainName: !Ref DomainName
      RepositoryName: !Sub "${RepositoryName}-staging"
      Tags:
        - Key: yor_trace
          Value: e6c7937f-50bc-49fa-8556-6459fc5627f2
        - Key: manny
          Value: cepeda
        - Key: git_org
          Value: itariq20
