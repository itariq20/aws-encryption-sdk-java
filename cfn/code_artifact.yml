AWSTemplateFormatVersion: 2010-09-09
Description: "Template for CodeArtifact repositories. Creates Domain if CreateDomainFlag is True"
Parameters:
  DomainName:
    Type: String
    Description: The name of the CodeArtifact Domain
    Default: crypto-tools-internal
  RepositoryName:
    Type: String
    Description: Base Name for the Repositories
    Default: esdk-java
  CreateDomainFlag:
    Type: String
    Description: Attempt to create Domain or not
    Default: False
    AllowedValues:
      - True
      - False

Conditions:
  CreateDomain: !Equals
    - !Ref CreateDomainFlag
    - True

Resources:
  Domain:
    Type: AWS::CodeArtifact::Domain
    Condition: CreateDomain
    Properties:
      DomainName: !Ref DomainName
      Tags:
        - Key: yor_trace
          Value: 48903474-3400-4087-83d2-c9067a090a4e
        - Key: manny
          Value: cepeda
        - Key: git_org
          Value: itariq20
  CIRepo:
    Type: AWS::CodeArtifact::Repository
    Properties:
      DomainName: !Ref DomainName
      RepositoryName: !Sub "${RepositoryName}-ci"
      Tags:
        - Key: yor_trace
          Value: f3ef070f-09f7-4129-a0de-efa59eaca4db
        - Key: manny
          Value: cepeda
        - Key: git_org
          Value: itariq20
  StagingRepo:
    Type: AWS::CodeArtifact::Repository
    Properties:
      DomainName: !Ref DomainName
      RepositoryName: !Sub "${RepositoryName}-staging"
      Tags:
        - Key: git_org
          Value: itariq20
        - Key: yor_trace
          Value: f2f9014f-86d6-445c-9e19-8c5d53385616
        - Key: manny
          Value: cepeda
